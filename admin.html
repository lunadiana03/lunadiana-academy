<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理画面 | ルナディアーナ学園</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,200..400,0..1,0&display=block">
<link rel="stylesheet" href="css/style.css">
<style>
  main { padding-right: 0; }
  .site-header { padding-right: 28px; }
  .adm-wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
  .adm-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .adm-tabs button { padding: 8px 18px; border-radius: 999px; background: #fff; color: var(--navy); box-shadow: inset 0 0 0 1px #cfd6ea; font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 14px; transition: background .3s, color .3s; }
  .adm-tabs button.on { background: var(--navy2); color: #fff; box-shadow: none; }
  .adm-panel { background: #fff; border-radius: 6px; padding: 32px; box-shadow: 0 10px 30px rgba(31,52,120,.07); animation: toastIn0 .4s var(--ease) both; }
  @keyframes toastIn0 { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .adm-panel h2 { font-family: 'Shippori Mincho B1', serif; color: var(--ink); margin: 0 0 22px; font-size: 22px; }
  .adm-list { border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-bottom: 22px; background: #fafbff; }
  .adm-list > .lbl { font-family: 'Shippori Mincho B1', serif; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
  .adm-item { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px 16px 4px; margin-bottom: 12px; }
  .adm-item .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--sub); }
  .adm-item .hd b { flex: 1; color: var(--navy2); }
  .icon-btn { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--navy2); background: var(--sky); transition: background .2s; }
  .icon-btn:hover { background: #dbe3f8; }
  .icon-btn.del { color: #c0476b; background: #fbe9ef; }
  .icon-btn .mi { font-size: 20px; }
  .add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; color: var(--navy2); box-shadow: inset 0 0 0 1px var(--navy3); font-size: 14px; background: #fff; }
  .field small { display: block; color: var(--sub); font-size: 12px; margin-top: 4px; }
  .save-bar { position: sticky; bottom: 16px; display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; }
  .req-card { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .req-card .m { font-size: 12.5px; color: var(--sub); }
  .req-card b { color: var(--ink); font-size: 16px; }
  .req-card p { margin: 6px 0 0; white-space: pre-line; font-size: 14px; }
  .demo-note { background: var(--gold3); color: var(--ink); padding: 10px 16px; border-radius: 6px; font-size: 13.5px; margin-bottom: 22px; }
  @media (max-width: 760px) { .site-header { padding-right: 16px; } .adm-panel { padding: 22px 16px; } body { padding-bottom: 0; } }
</style>
</head>
<body>
<header class="site-header" id="site-header">
  <a class="brand" href="index.html"><img src="img/emblem.png" alt=""><span><small>管理画面</small><b>ルナディアーナ学園</b></span></a>
  <button class="btn line" id="logout" style="display:none;padding:8px 20px" onclick="logout()"><span class="mi">logout</span>ログアウト</button>
</header>
<main><div class="adm-wrap" id="adm"></div></main>
<script src="js/common.js"></script>
<script>
const PW_KEY = 'lda_admin_pw';
let pw = '';
try { pw = sessionStorage.getItem(PW_KEY) || ''; } catch (e) {}
let draft = null, tab = 'site', reqs = [];
const box = () => document.getElementById('adm');
const clone = o => JSON.parse(JSON.stringify(o));

function demoNote() { return API_URL ? '' : '<div class="demo-note">お試しモードです（GASのURLが未設定）。保存はこのブラウザの中だけに残ります。パスワードは「admin」です。</div>'; }

function showLogin(msg) {
  document.getElementById('logout').style.display = 'none';
  box().innerHTML = `${demoNote()}<form class="form" onsubmit="login(event)" style="max-width:440px">
    <div class="sec-head" style="margin-bottom:28px"><span class="en">ADMIN</span><h2 style="font-size:24px">管理画面</h2></div>
    <div class="field"><label for="pw">パスワード</label><input type="password" id="pw" autocomplete="current-password" required></div>
    ${msg ? `<p style="color:#c0476b;margin:0 0 14px;font-size:14px">${esc(msg)}</p>` : ''}
    <p class="center" style="margin:0"><button class="btn" type="submit">ログイン<span class="mi">login</span></button></p></form>`;
}
function login(e) {
  e.preventDefault();
  const v = document.getElementById('pw').value;
  api('checkKey', { password: v }).then(res => {
    if (!res || !res.ok) return showLogin((res && res.error) || 'ログインできませんでした');
    pw = v; try { sessionStorage.setItem(PW_KEY, pw); } catch (er) {}
    start();
  });
}
function logout() { pw = ''; try { sessionStorage.removeItem(PW_KEY); } catch (e) {} showLogin(); }

function start() {
  box().innerHTML = '<p class="center" style="color:var(--sub)">読み込み中…</p>';
  api('get').then(res => {
    if (!res || !res.ok) { box().innerHTML = `<p class="center">${esc((res && res.error) || '読み込めませんでした')}</p>`; return; }
    draft = clone(mergeContent(res.content || {}));
    document.getElementById('logout').style.display = '';
    render();
  });
}

function tabs() {
  const keys = Object.keys(SCHEMA);
  return `<div class="adm-tabs">${keys.map(k => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')">${esc(SCHEMA[k].label)}</button>`).join('')}
    <button class="${tab === '_req' ? 'on' : ''}" onclick="go('_req')">資料請求の受付</button></div>`;
}
function go(k) { tab = k; if (k === '_req') loadReqs(); else render(); }

function getAt(path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], draft); }
function setAt(path, val) { const ks = path.split('.'); const last = ks.pop(); const o = ks.reduce((x, k) => x[k], draft); o[last] = val; }

function fieldHtml(f, path) {
  const v = getAt(path); const id = 'f_' + path.replace(/\./g, '_');
  let input;
  if (f.type === 'textarea') input = `<textarea id="${id}" data-path="${path}" rows="4">${esc(v)}</textarea>`;
  else input = `<input id="${id}" data-path="${path}" type="${f.type === 'date' ? 'date' : f.type === 'url' ? 'url' : 'text'}" value="${esc(v)}">`;
  const hint = f.k === 'icon' ? '<small>fonts.google.com/icons の名前（例：music_note）</small>' : f.k === 'marshmallowUrl' ? '<small>空にすると「準備中」と表示されます</small>' : '';
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${input}${hint}</div>`;
}
function listHtml(def, path, label) {
  const arr = getAt(path) || [];
  return `<div class="adm-list"><div class="lbl">${esc(label)}</div>
    ${arr.map((_, i) => `<div class="adm-item"><div class="hd"><b>${esc(def.itemLabel || '項目')} ${i + 1}</b>
      ${def.fixed ? '' : `<button class="icon-btn" title="上へ" onclick="move('${path}',${i},-1)"><span class="mi">arrow_upward</span></button>
      <button class="icon-btn" title="下へ" onclick="move('${path}',${i},1)"><span class="mi">arrow_downward</span></button>
      <button class="icon-btn del" title="削除" onclick="removeItem('${path}',${i})"><span class="mi">delete</span></button>`}</div>
      ${def.fields.map(f => fieldHtml(f, `${path}.${i}.${f.k}`)).join('')}</div>`).join('')}
    ${def.fixed ? '' : `<button class="add-btn" onclick="addItem('${path}')"><span class="mi">add</span>${esc(def.itemLabel || '項目')}を追加</button>`}</div>`;
}
function render() {
  const sc = SCHEMA[tab];
  let body;
  if (sc.list) body = listHtml(sc, tab, sc.label);
  else body = sc.fields.map(f => f.type === 'list' ? listHtml(f, `${tab}.${f.k}`, f.label) : fieldHtml(f, `${tab}.${f.k}`)).join('');
  box().innerHTML = `${demoNote()}${tabs()}<div class="adm-panel"><h2>${esc(sc.label)}</h2>${body}
    <div class="save-bar"><button class="btn line" onclick="resetTab()">初期の文章に戻す</button><button class="btn" id="save-btn" onclick="saveTab()">保存する<span class="mi">save</span></button></div></div>`;
}
document.addEventListener('input', e => { const p = e.target.dataset && e.target.dataset.path; if (p) setAt(p, e.target.value); });

function addItem(path) {
  const arr = getAt(path);
  const item = {};
  const def = path.includes('.') ? SCHEMA[path.split('.')[0]].fields.find(f => f.k === path.split('.')[1]) : SCHEMA[path];
  def.fields.forEach(f => { item[f.k] = ''; });
  if (path === 'news') { item.id = 'n' + Date.now().toString(36); item.date = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); item.cat = 'お知らせ'; arr.unshift(item); }
  else arr.push(item);
  render();
}
function removeItem(path, i) { if (!confirm('この項目を削除しますか？（保存するまで反映されません）')) return; getAt(path).splice(i, 1); render(); }
function move(path, i, d) { const a = getAt(path), j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; render(); }
function resetTab() { if (!confirm('この画面の内容を初期の文章に戻しますか？（保存するまで反映されません）')) return; draft[tab] = clone(DEFAULTS[tab]); render(); }

function saveTab() {
  const btn = document.getElementById('save-btn'); btn.disabled = true; btn.style.opacity = '.6';
  if (tab === 'news') draft.news.forEach(n => { if (!n.id) n.id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); });
  api('save', { password: pw, key: tab, value: draft[tab] }).then(res => {
    btn.disabled = false; btn.style.opacity = '';
    if (!res || !res.ok) return toast((res && res.error) || '保存できませんでした');
    try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    toast('保存しました');
  });
}

function loadReqs() {
  box().innerHTML = `${demoNote()}${tabs()}<div class="adm-panel"><h2>資料請求の受付</h2><p style="color:var(--sub)">読み込み中…</p></div>`;
  api('listRequests', { password: pw }).then(res => {
    if (!res || !res.ok) return toast((res && res.error) || '読み込めませんでした');
    reqs = res.requests || [];
    renderReqs();
  });
}
function renderReqs() {
  const fmt = t => { const d = new Date(t); return isNaN(d) ? esc(t) : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
  box().innerHTML = `${demoNote()}${tabs()}<div class="adm-panel"><h2>資料請求の受付（${reqs.length}件）</h2>
    ${reqs.length ? reqs.map(r => `<div class="req-card"><div><div class="m">${fmt(r.at)}${r.kumi ? ' ・ ' + esc(r.kumi) : ''}</div><b>${esc(r.name)}</b>
      <div class="m">連絡先：${esc(r.contact)}</div>${r.message ? `<p>${esc(r.message)}</p>` : ''}</div>
      <button class="icon-btn del" title="削除" onclick="delReq('${esc(r.id)}')"><span class="mi">delete</span></button></div>`).join('')
      : '<p style="color:var(--sub)">まだ受付はありません</p>'}</div>`;
}
function delReq(id) {
  if (!confirm('この受付を削除しますか？')) return;
  api('deleteRequest', { password: pw, id }).then(res => {
    if (!res || !res.ok) return toast((res && res.error) || '削除できませんでした');
    reqs = reqs.filter(r => r.id !== id); renderReqs(); toast('削除しました');
  });
}

if (pw) api('checkKey', { password: pw }).then(res => res && res.ok ? start() : logout());
else showLogin();
</script>
</body>
</html>
